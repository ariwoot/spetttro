<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Mappa Europa con Leaflet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>

  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: sans-serif;
    }
    #map {
      flex: 3;
    }
    #sidebar {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: #f9f9f9;
      border-left: 1px solid #ccc;
    }
    #sidebar h2 {
      margin-top: 0;
    }
    .place-item {
      padding: 6px;
      cursor: pointer;
      border-bottom: 1px solid #ddd;
    }
    .place-item:hover {
      background: #eee;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="sidebar">
    <h2>Luoghi</h2>
    <div id="places-list"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <!-- GeoJSON confini Europa (semplificati) -->
  <script src="https://unpkg.com/geojson-europe/Europe.geo.json"></script>

  <script>
    // Inizializza la mappa
    var map = L.map('map').setView([50, 10], 4);

    // Aggiungi tile layer OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Aggiungi confini Europa colorati
    L.geoJSON(Europe, {
      style: function (feature) {
        return {
          color: "#555",
          weight: 1,
          fillColor: "#cce5ff",
          fillOpacity: 0.4
        };
      }
    }).addTo(map);

    // Dati dei luoghi
    var places = [
      { name: "Roma", coords: [41.9028, 12.4964], info: "Capitale d'Italia" },
      { name: "Parigi", coords: [48.8566, 2.3522], info: "Capitale della Francia" },
      { name: "Berlino", coords: [52.52, 13.405], info: "Capitale della Germania" },
      { name: "Madrid", coords: [40.4168, -3.7038], info: "Capitale della Spagna" },
      { name: "Atene", coords: [37.9838, 23.7275], info: "Capitale della Grecia" }
      // ... aggiungi fino a 50 luoghi
    ];

    // Creiamo un gruppo cluster
    var markers = L.markerClusterGroup();

    // Aggiungi marker
    var markerMap = {}; // Per associare nome → marker
    places.forEach(function(place) {
      var marker = L.marker(place.coords)
        .bindPopup("<b>" + place.name + "</b><br>" + place.info);
      markers.addLayer(marker);
      markerMap[place.name] = marker;

      // Aggiungi alla lista laterale
      var item = document.createElement("div");
      item.className = "place-item";
      item.textContent = place.name;
      item.onclick = function() {
        map.setView(place.coords, 8);
        marker.openPopup();
      };
      document.getElementById("places-list").appendChild(item);
    });

    map.addLayer(markers);
  </script>
</body>
</html>
