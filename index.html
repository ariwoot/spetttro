<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mappa con Leaflet + MarkerCluster (esempio funzionante)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    html,body { height: 100%; margin: 0; font-family: Arial, Helvetica, sans-serif; }
    .wrap { display: flex; height: 100vh; }
    #map { flex: 1 1 0; }
    #sidebar {
      width: 320px;
      max-width: 40%;
      background: #fafafa;
      border-left: 1px solid #ddd;
      overflow: auto;
      padding: 12px;
    }
    h2 { margin-top: 0; }
    .place-item {
      padding: 8px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    .place-item:hover { background: #f0f0f0; }
    .controls { margin-bottom: 10px; }
    .small { font-size: 0.9em; color: #666; }
  </style>
</head>
<body>
<div style="display:flex; height:100vh;">
  <div id="map" style="flex:3;"></div>
  <div id="sidebar" style="flex:1; padding:10px; overflow-y:auto;">
    <h3>Filtra per categoria</h3>
    <select id="category-filter">
      <option value="all">Tutte</option>
      <option value="Arte">Arte</option>
      <option value="Patrimonio">Patrimonio</option>
      <option value="Cultura">Cultura</option>
    </select>
    <br><br>
    <select id="subcategory-filter">
      <option value="all">Tutte le sottocategorie</option>
      <option value="Musei">Musei</option>
      <option value="Siti UNESCO">Siti UNESCO</option>
      <option value="Siti Archeologici">Siti Archeologici</option>
      <option value="Eventi">Eventi</option>
    </select>
  </div>
</div>

<!-- Leaflet + MarkerCluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>
const map = L.map('map').setView([50, 10], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// Dati con categorie e sottocategorie
const places = [
  { name: "Colosseo", coords: [41.8902, 12.4922], category: "Patrimonio", subcategory: "Siti UNESCO", info: "Anfiteatro Flavio a Roma." },
  { name: "Museo del Louvre", coords: [48.8606, 2.3376], category: "Arte", subcategory: "Musei", info: "Famoso museo di Parigi." },
  { name: "Pompei", coords: [40.7484, 14.4860], category: "Patrimonio", subcategory: "Siti Archeologici", info: "Città romana sepolta dal Vesuvio." },
  { name: "Festival di Edimburgo", coords: [55.9533, -3.1883], category: "Cultura", subcategory: "Eventi", info: "Festival artistico annuale." }
];

// Crea il cluster
const markersCluster = L.markerClusterGroup();
map.addLayer(markersCluster);

// Creo marker e li salvo
const allMarkers = places.map(place => {
  const marker = L.marker(place.coords)
    .bindPopup(`<b>${place.name}</b><br>${place.info}`);
  marker.category = place.category;
  marker.subcategory = place.subcategory;
  return marker;
});

// Funzione per aggiornare mappa in base ai filtri
function updateMarkers() {
  const selectedCat = document.getElementById('category-filter').value;
  const selectedSubcat = document.getElementById('subcategory-filter').value;

  markersCluster.clearLayers();

  const filtered = allMarkers.filter(m => {
    const matchCat = selectedCat === 'all' || m.category === selectedCat;
    const matchSubcat = selectedSubcat === 'all' || m.subcategory === selectedSubcat;
    return matchCat && matchSubcat;
  });

  markersCluster.addLayers(filtered);
  if (filtered.length) map.fitBounds(L.featureGroup(filtered).getBounds());
}

// Event listener sui select
document.getElementById('category-filter').addEventListener('change', updateMarkers);
document.getElementById('subcategory-filter').addEventListener('change', updateMarkers);

// Mostra tutti i marker al caricamento
updateMarkers();
</script>
</body>
</html>
