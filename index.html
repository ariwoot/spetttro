<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mappa con Leaflet + MarkerCluster (esempio funzionante)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    html,body { height: 100%; margin: 0; font-family: Arial, Helvetica, sans-serif; }
    .wrap { display: flex; height: 100vh; }
    #map { flex: 1 1 0; }
    #sidebar {
      width: 320px;
      max-width: 40%;
      background: #fafafa;
      border-left: 1px solid #ddd;
      overflow: auto;
      padding: 12px;
    }
    h2 { margin-top: 0; }
    .place-item {
      padding: 8px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    .place-item:hover { background: #f0f0f0; }
    .controls { margin-bottom: 10px; }
    .small { font-size: 0.9em; color: #666; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="map"></div>
    <aside id="sidebar">
      <h2>Luoghi (demo)</h2>
      <div class="controls small">Clicca un luogo per centrare la mappa e aprire il popup.</div>
      <div id="places-list"></div>
    </aside>
  </div>

  <!-- Leaflet JS (deve venire prima di MarkerCluster) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    // In alcuni ambienti le icone di default non vengono trovate: forza i percorsi CDN.
    L.Icon.Default.mergeOptions({
      iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
      iconUrl:       'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
      shadowUrl:     'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png'
    });

    // Inizializza mappa
    const map = L.map('map').setView([50, 10], 4);

    // Tile layer (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    

    const places = [
  { name: "Colosseo", coords: [41.8902, 12.4922], category: "Patrimonio", subcategory: "Siti UNESCO", info: "Anfiteatro Flavio a Roma." },
  { name: "Museo del Louvre", coords: [48.8606, 2.3376], category: "Arte", subcategory: "Musei", info: "Famoso museo di Parigi." },
  { name: "Pompei", coords: [40.7484, 14.4860], category: "Patrimonio", subcategory: "Siti Archeologici", info: "Città romana sepolta dal Vesuvio." },
  { name: "Festival di Edimburgo", coords: [55.9533, -3.1883], category: "Cultura", subcategory: "Eventi", info: "Festival artistico annuale." }
];


    // Crea marker cluster group
    const markersCluster = L.markerClusterGroup({
      showCoverageOnHover: false,
      spiderfyOnMaxZoom: true,
      chunkedLoading: true
    });
    
// Crea il cluster
map.addLayer(markersCluster);

// Creo marker e li salvo
const allMarkers = places.map(place => {
  const marker = L.marker(place.coords)
    .bindPopup(`<b>${place.name}</b><br>${place.info}`);
  marker.category = place.category;
  marker.subcategory = place.subcategory;
  return marker;
});

// Funzione per aggiornare mappa in base ai filtri
function updateMarkers() {
  const selectedCat = document.getElementById('category-filter').value;
  const selectedSubcat = document.getElementById('subcategory-filter').value;

  markersCluster.clearLayers();

  const filtered = allMarkers.filter(m => {
    const matchCat = selectedCat === 'all' || m.category === selectedCat;
    const matchSubcat = selectedSubcat === 'all' || m.subcategory === selectedSubcat;
    return matchCat && matchSubcat;
  });

  markersCluster.addLayers(filtered);
  if (filtered.length) map.fitBounds(L.featureGroup(filtered).getBounds());
}

// Event listener sui select
document.getElementById('category-filter').addEventListener('change', updateMarkers);
document.getElementById('subcategory-filter').addEventListener('change', updateMarkers);

// Mostra tutti i marker al caricamento
updateMarkers();
      

      // crea elemento lista
      const item = document.createElement('div');
      item.className = 'place-item';
      item.innerHTML = `<strong>${p.name}</strong><div class="small">${p.coords[0].toFixed(4)}, ${p.coords[1].toFixed(4)}</div>`;
      item.onclick = function() {
        // Centro la mappa e apro popup del marker corrispondente.
        map.setView(p.coords, 8, { animate: true });
        // Se il marker è in un cluster "compresso", marker.openPopup() lo aprirà comunque.
        markerById[p.id].openPopup();
      };
      listContainer.appendChild(item);
    });

    // Centra la mappa sui marker (utile)
    if (markersCluster.getLayers().length) {
      map.fitBounds(markersCluster.getBounds(), { padding: [40, 40] });
    }

    // DEBUG: se non vedi i pin controlla la console del browser (F12 → Console)
  </script>
</body>
</html>
